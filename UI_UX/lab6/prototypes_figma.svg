<svg width="1600" height="2100" viewBox="0 0 1600 2100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill:#F7F7FA; }
      .frame { fill:#FFFFFF; stroke:#1F2937; stroke-width:2; rx:24; }
      .card { fill:#FFFFFF; stroke:#374151; stroke-width:2; rx:16; }
      .light { fill:#F3F4F6; stroke:#9CA3AF; stroke-width:1.5; rx:12; }
      .muted { fill:#E5E7EB; }
      .line { stroke:#4B5563; stroke-width:2; stroke-linecap:round; }
      .thin { stroke:#9CA3AF; stroke-width:1.5; stroke-linecap:round; }
      .txt { fill:#111827; font-family:Arial, Helvetica, sans-serif; }
      .h1 { font-size:28px; font-weight:700; }
      .h2 { font-size:20px; font-weight:700; }
      .h3 { font-size:16px; font-weight:700; }
      .p  { font-size:13px; font-weight:400; }
      .sm { font-size:12px; font-weight:400; }
      .btn { fill:#E5E7EB; stroke:#374151; stroke-width:2; rx:10; }
    </style>
  </defs>

  <rect width="1600" height="2100" class="bg"/>
  <text x="70" y="55" class="txt h1">SVG-прототипы для лабораторной работы — сайт мобильного оператора</text>
  <text x="70" y="85" class="txt p">Файл можно импортировать в Figma как единый лист с 6 веб-экранами.</text>

