    <rect x="48" y="192" width="110" height="14" class="light"/>
    <rect x="214" y="192" width="110" height="14" class="light"/>
    <rect x="380" y="192" width="110" height="14" class="light"/>
    <rect x="546" y="192" width="110" height="14" class="light"/>

    <rect x="48" y="224" width="90" height="12" class="light"/>
    <rect x="48" y="246" width="80" height="12" class="light"/>
    <rect x="48" y="268" width="70" height="12" class="light"/>

    <rect x="214" y="224" width="90" height="12" class="light"/>
    <rect x="214" y="246" width="80" height="12" class="light"/>
    <rect x="214" y="268" width="70" height="12" class="light"/>

    <rect x="380" y="224" width="90" height="12" class="light"/>
    <rect x="380" y="246" width="80" height="12" class="light"/>
    <rect x="380" y="268" width="70" height="12" class="light"/>

    <rect x="546" y="224" width="90" height="12" class="light"/>
