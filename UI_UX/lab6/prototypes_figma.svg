    <rect x="217" y="170" width="92" height="12" class="light"/>
    <rect x="384" y="170" width="92" height="12" class="light"/>
    <rect x="551" y="170" width="92" height="12" class="light"/>
    <rect x="50" y="192" width="78" height="12" class="light"/>
    <rect x="217" y="192" width="78" height="12" class="light"/>
    <rect x="384" y="192" width="78" height="12" class="light"/>
    <rect x="551" y="192" width="78" height="12" class="light"/>
