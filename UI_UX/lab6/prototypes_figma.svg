    <rect x="500" y="74" width="140" height="22" class="light"/>

    <rect x="28" y="140" width="150" height="320" class="card"/>
    <rect x="194" y="140" width="150" height="320" class="card"/>
    <rect x="360" y="140" width="150" height="320" class="card"/>
    <rect x="526" y="140" width="150" height="320" class="card"/>

    <text x="48" y="174" class="txt h3">Стартовый</text>
