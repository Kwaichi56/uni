    <circle cx="267" cy="304" r="22" class="light"/>
    <circle cx="434" cy="304" r="22" class="light"/>
    <circle cx="601" cy="304" r="22" class="light"/>
    <line x1="173" y1="304" x2="195" y2="304" class="line"/>
    <line x1="340" y1="304" x2="362" y2="304" class="line"/>
    <line x1="507" y1="304" x2="529" y2="304" class="line"/>
